<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Offline - Cantina Fácil</title>
  <style>
    :root {
      --primary: #1b5e20;
      --secondary: #fbc02d;
      --bg: #f4f6f8;
      --card-bg: #ffffff;
      --text: #263238;
      --text-muted: #546e7a;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      background: var(--bg);
      color: var(--text);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: 20px;
      text-align: center;
    }
    .offline-card {
      background: var(--card-bg);
      border-radius: 20px;
      padding: 32px 24px;
      max-width: 420px;
      width: 100%;
      box-shadow: 0 10px 30px rgba(0,0,0,0.08);
      border-top: 6px solid var(--primary);
    }
    .icon {
      width: 80px;
      height: 80px;
      margin: 0 auto 16px;
      background: #e8f5e9;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 36px;
    }
    h1 {
      font-size: 1.4rem;
      color: var(--primary);
      margin-bottom: 8px;
    }
    p {
      color: var(--text-muted);
      font-size: 0.95rem;
      line-height: 1.5;
      margin-bottom: 24px;
    }
    .badge {
      display: inline-block;
      background: #fff8e1;
      color: #f57f17;
      padding: 6px 14px;
      border-radius: 50px;
      font-size: 0.82rem;
      font-weight: 600;
      margin-bottom: 20px;
      border: 1px solid #ffe082;
    }
    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 100%;
      background: var(--primary);
      color: #ffffff;
      font-weight: 700;
      padding: 14px 20px;
      border-radius: 12px;
      text-decoration: none;
      border: none;
      cursor: pointer;
      font-size: 1rem;
      transition: background 0.2s;
    }
    .btn:hover {
      background: #2e7d32;
    }
  </style>
</head>
<body>
  <div class="offline-card">
    <div class="icon">🥪</div>
    <div class="badge">📡 Modo Offline Ativo</div>
    <h1>Cantina Fácil</h1>
    <p>Você está desconectado da internet. O aplicativo principal da Cantina Fácil continua disponível em cache!</p>
    <button class="btn" onclick="window.location.href='./index.html'">Acessar Aplicativo em Cache</button>
  </div>
</body>
</html>
